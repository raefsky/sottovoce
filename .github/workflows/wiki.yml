# Copia le pagine della cartella wiki/ nel wiki di GitHub a ogni modifica su main.
# Le pagine modificate solo dal sito del wiki vengono sovrascritte alla copia successiva:
# per cambiare il wiki, modifica i file in wiki/.
name: Pubblica il wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copia le pagine nel wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cp wiki/*.md "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Il wiki è già aggiornato."
          else
            git commit -m "Aggiorna il wiki da ${GITHUB_SHA::7}"
            git push
          fi
